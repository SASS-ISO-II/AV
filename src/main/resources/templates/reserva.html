<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Reserva</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    padding: 40px 20px;
    background: linear-gradient(to bottom, #F3E9DA 0%, #F3E9DA 45%, #6AA89B 45%, #6AA89B 100%);
    position: relative;
    overflow-x: hidden;
}


.circle {
    position: absolute;
    border-radius: 50%;
    opacity: 0.22;
    filter: blur(3px);
    z-index: -1;
}

.c1 { width: 260px; height: 260px; top: 20px; left: 20px; background: #D9C8B4; animation: float1 18s infinite alternate; }
.c2 { width: 340px; height: 340px; top: 180px; right: -60px; background: #1A3C40; opacity: 0.15; animation: float2 22s infinite alternate; }
.c3 { width: 160px; height: 160px; bottom: 50px; left: 25%; background: #B8D7CE; animation: float3 26s infinite alternate; }

@keyframes float1 { from { transform: translateY(0);} to { transform: translateY(40px);} }
@keyframes float2 { from { transform: translateY(0);} to { transform: translateY(-35px);} }
@keyframes float3 { from { transform: translateY(0);} to { transform: translateY(25px);} }


h2 {
    text-align: center;
    font-size: 30px;
    color: #1A3C40;
    margin-bottom: 22px;
    font-weight: 600;
}


.form-wrapper {
    width: 480px;
    margin: 0 auto;
    background: #FAF4E8;
    padding: 34px;
    border-radius: 30px;
    box-shadow: 0 26px 60px rgba(0,0,0,0.22);
    border: 2px solid #E6D9C5;
    animation: fadeIn 0.55s ease-out, slideUp 0.65s ease-out;
}


h3 {
    margin-bottom: 10px;
    font-size: 19px;
    color: #1A3C40;
    font-weight: 600;
}

.info-box {
    background: #F8F1E6;
    padding: 15px;
    border-radius: 14px;
    border: 1px solid #D9C8B4;
    margin-bottom: 20px;
}

label {
    font-weight: 500;
    color: #1A3C40;
}

input[type="date"] {
    width: 100%;
    padding: 12px 14px;
    margin-top: 6px;
    border-radius: 12px;
    border: 1px solid #D9C8B4;
    background: #FFF9F0;
    transition: .18s;
    font-size: 15px;
    margin-bottom: 15px;
}

input[type="date"]:focus {
    border-color: #6AA89B;
    box-shadow: 0 0 0 3px rgba(106,168,155,0.25);
    outline: none;
}


#politicaBlock {
    background: #FFF4D9;
    padding: 16px;
    border-radius: 14px;
    border: 1px solid #E6D9C5;
    margin-bottom: 20px;
}


.reservas-list {
    background: #F8F1E6;
    padding: 15px;
    border-radius: 14px;
    border: 1px solid #D9C8B4;
    margin-bottom: 20px;
}


button, .btn {
    width: 100%;
    padding: 14px;
    border: none;
    background: #1A3C40;
    color: #F8F8F8;
    border-radius: 18px;
    cursor: pointer;
    font-size: 16px;
    font-weight: 600;
    margin-top: 10px;
    transition: .18s;
}

button:hover, .btn:hover { background: #163236; }
button:active, .btn:active { transform: scale(0.97); }


@keyframes fadeIn { from { opacity: 0;} to { opacity: 1;} }
@keyframes slideUp { from { transform: translateY(20px); opacity:0;} to { transform: translateY(0); opacity:1;} }

.error-message {
    color: #B80000;
    font-weight: 600;
    background: #FFE4E4;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid #FFBDBD;
    margin-bottom: 18px;
}

ul.sin-puntos {
    list-style: none;
    padding-left: 0;
    margin-left: 0;
}
</style>
</head>

<body>

<div class="circle c1"></div>
<div class="circle c2"></div>
<div class="circle c3"></div>

<h2>Reservar Inmueble</h2>

<div class="form-wrapper">

<form th:action="@{/reserva}" th:object="${reserva}" method="post">

   
    <div th:if="${inmueble}" class="info-box">
        <h3>Inmueble seleccionado</h3>
        <p th:text="'Calle: ' + ${inmueble.calle}"></p>
        <p th:text="'Número: ' + ${inmueble.numero}"></p>
        <p th:text="'Precio por noche: ' + ${inmueble.precioNoche} + ' €'"></p>
    </div>

   
    <label>Fecha inicio:</label>
    <input type="date" th:field="*{fechaInicio}" name="fechaInicio" required />

    <label>Fecha fin:</label>
    <input type="date" th:field="*{fechaFin}" name="fechaFin" required />

    
    <div id="politicaBlock" style="display:none;">
        <p><strong>Política de cancelación:</strong> <span id="politicaTexto"></span></p>
    </div>

    <input type="hidden" id="politicaHidden" name="politicaCancelacion" />


    <div th:if="${error}" class="error-message">
        <p th:text="${error}"></p>
    </div>


    <div class="reservas-list">
        <p><strong>Fechas ya reservadas:</strong></p>
        <ul class="sin-puntos">
            <li th:each="res : ${reservasExistentes}">
                <span th:text="${res.fechaInicio}"></span> -
                <span th:text="${res.fechaFin}"></span>
            </li>
        </ul>
    </div>


    <button type="submit">Confirmar Reserva</button>
    <button type="reset" class="btn">Reiniciar</button>

</form>
</div>

<script>
function calcularPolitica() {
    const inicio = document.querySelector("input[name='fechaInicio']").value;
    const fin = document.querySelector("input[name='fechaFin']").value;

    if (!inicio || !fin) return;

    const fechaInicio = new Date(inicio);
    const fechaFin = new Date(fin);

    const diferenciaMs = fechaFin - fechaInicio;
    const dias = diferenciaMs / (1000 * 60 * 60 * 24);

    let politica = "";

    if (dias <= 3) politica = "REEMBOLSABLE";
    else if (dias <= 8) politica = "REEMBOLSABLE_50_PER";
    else politica = "NO_REEMBOLSABLE";

    document.getElementById("politicaBlock").style.display = "block";
    document.getElementById("politicaTexto").innerText = politica;
    document.getElementById("politicaHidden").value = politica;
}

document.querySelector("input[name='fechaInicio']").addEventListener("change", calcularPolitica);
document.querySelector("input[name='fechaFin']").addEventListener("change", calcularPolitica);
</script>

</body>
</html>
