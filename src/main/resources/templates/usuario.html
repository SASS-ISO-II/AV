<!DOCTYPE HTML>
<html xmlns:th="https://www.thymeleaf.org">
	<head>
		<title>Información de usuario</title>
		<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
	</head>
	<body>
		<h1>Usuario</h1>
		<p th:text="'Nombre: ' + ${login.nombre}" />
		<p th:text="'Apellidos: ' + ${login.apellidos}" />
		<p th:text="'Dirección: ' + ${login.direccion}" />
		<p th:text="'Nombre de usuario: ' + ${login.login}" />
		<a href="/login">Entrar con otro usuario</a>
	</body>
</html>
