<!DOCTYPE HTML>
<html xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Detalle del Inmueble</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    padding: 40px 20px;
    background: linear-gradient(to bottom, #F3E9DA 0%, #F3E9DA 45%, #6AA89B 45%, #6AA89B 100%);
    position: relative;
    overflow-x: hidden;
}

/* === Burbujas === */
.circle {
    position: absolute;
    border-radius: 50%;
    opacity: 0.22;
    filter: blur(3px);
    z-index: -1;
}

.c1 { width: 260px; height: 260px; top: 20px; left: 20px; background: #D9C8B4; animation: float1 18s infinite alternate; }
.c2 { width: 340px; height: 340px; top: 180px; right: -60px; background: #1A3C40; opacity: 0.15; animation: float2 22s infinite alternate; }
.c3 { width: 160px; height: 160px; bottom: 50px; left: 25%; background: #B8D7CE; animation: float3 26s infinite alternate; }

@keyframes float1 { from { transform: translateY(0); } to { transform: translateY(40px); } }
@keyframes float2 { from { transform: translateY(0); } to { transform: translateY(-35px); } }
@keyframes float3 { from { transform: translateY(0); } to { transform: translateY(25px); } }

/* === Título === */
h1 {
    text-align: center;
    font-size: 30px;
    color: #1A3C40;
    font-weight: 600;
    margin-bottom: 25px;
}

/* === TARJETA === */
.card {
    width: 460px;
    margin: 0 auto;
    background: #FAF4E8;
    padding: 36px;
    border-radius: 34px;
    border: 2px solid #E6D9C5;
    box-shadow: 0 28px 60px rgba(0,0,0,0.22);
    animation: fadeIn 0.55s ease-out, slideUp 0.65s ease-out;
}

p {
    margin: 10px 0;
    color: #1A3C40;
    font-size: 16px;
    font-weight: 500;
}

/* ========= Enlaces ========= */

a {
    display: inline-block;
    margin-top: 14px;
    color: #1A3C40;
    font-weight: 600;
    text-decoration: none;
    transition: 0.2s;
}

a:hover {
    text-decoration: underline;
    opacity: 0.8;
}

/* Animaciones */
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

</style>
</head>

<body>

<div class="circle c1"></div>
<div class="circle c2"></div>
<div class="circle c3"></div>

<h1>Detalle del Inmueble</h1>

<div class="card">

    <p th:text="'Calle: ' + ${inmueble.calle}"></p>
    <p th:text="'Número: ' + ${inmueble.numero}"></p>
    <p th:text="'Localización: ' + ${inmueble.localizacion}"></p>
    <p th:text="'Precio por noche: ' + ${inmueble.precioNoche} + ' €'"></p>
    <p th:text="'Capacidad: ' + ${inmueble.capacidad} + ' personas'"></p>
    <p th:text="'Tipo: ' + ${inmueble.tipo}"></p>

    <a th:href="@{/reserva(inmuebleId=${inmueble.id})}">
        Reservar este inmueble
    </a>

    <br>

    <a href="/inmueble">Volver a ver todos los inmuebles</a>

</div>

</body>
</html>
