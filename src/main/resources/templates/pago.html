 <!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Pago</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    padding: 40px 20px;
    background: linear-gradient(to bottom, #F3E9DA 0%, #F3E9DA 45%, #6AA89B 45%, #6AA89B 100%);
    position: relative;
    overflow-x: hidden;
}


.circle {
    position: absolute;
    border-radius: 50%;
    opacity: 0.22;
    filter: blur(3px);
    z-index: -1;
}
.c1 {
    width: 260px; height: 260px;
    top: 20px; left: 20px;
    background: #D9C8B4;
    animation: float1 18s infinite ease-in-out alternate;
}
.c2 {
    width: 340px; height: 340px;
    top: 180px; right: -60px;
    background: #1A3C40;
    opacity: 0.15;
    animation: float2 22s infinite ease-in-out alternate;
}
.c3 {
    width: 160px; height: 160px;
    bottom: 50px; left: 25%;
    background: #B8D7CE;
    animation: float3 26s infinite ease-in-out alternate;
}

@keyframes float1 { from { transform: translateY(0);} to { transform: translateY(40px);} }
@keyframes float2 { from { transform: translateY(0);} to { transform: translateY(-35px);} }
@keyframes float3 { from { transform: translateY(0);} to { transform: translateY(25px);} }


h2 {
    text-align: center;
    font-size: 30px;
    color: #1A3C40;
    margin-bottom: 15px;
    font-weight: 600;
}

.total-box {
    text-align: center;
    background: #FAF4E8;
    padding: 18px;
    width: 360px;
    margin: 0 auto 25px auto;
    border-radius: 22px;
    border: 2px solid #E6D9C5;
    box-shadow: 0 18px 45px rgba(0,0,0,0.18);
    font-size: 17px;
    animation: fadeIn 0.55s ease-out, slideUp 0.65s ease-out;
}


.form-wrapper {
    width: 420px;
    margin: 0 auto;
    background: #FAF4E8;
    padding: 34px;
    border-radius: 30px;
    box-shadow: 0 26px 60px rgba(0,0,0,0.22);
    border: 2px solid #E6D9C5;
    animation: fadeIn 0.55s ease-out, slideUp 0.65s ease-out;
}

label {
    display: block;
    margin-top: 15px;
    font-weight: 500;
    color: #1A3C40;
}

select {
    width: 100%;
    margin-top: 6px;
    padding: 12px 14px;
    border-radius: 12px;
    border: 1px solid #D9C8B4;
    background: #F8F1E6;
    font-size: 15px;
    transition: .18s;
}

select:focus {
    border-color: #6AA89B;
    box-shadow: 0 0 0 3px rgba(106,168,155,0.25);
    outline: none;
}


button {
    margin-top: 24px;
    width: 100%;
    padding: 14px;
    border: none;
    background: #1A3C40;
    color: #F8F8F8;
    border-radius: 18px;
    cursor: pointer;
    font-size: 16px;
    font-weight: 600;
    transition: 0.18s ease;
}

button:hover { background: #163236; }
button:active { transform: scale(0.97); }


.link-volver {
    display: block;
    text-align: center;
    margin-top: 18px;
    color: #1A3C40;
    text-decoration: none;
}
.link-volver:hover { text-decoration: underline; }


@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
</style>
</head>

<body>

<div class="circle c1"></div>
<div class="circle c2"></div>
<div class="circle c3"></div>

<h2>Confirmar Pago</h2>

<div class="total-box">
    <p><b>Número de noches:</b> <span th:text="${noches}">0</span></p>
    <p><b>Total a pagar:</b> <span th:text="${totalAPagar}">0</span> €</p>
</div>

<div class="form-wrapper">
<form th:action="@{/pago}" th:object="${pago}" method="post">

    <label>Método de pago:</label>
    <select th:field="*{metodo}">
        <option th:each="m : ${metodos}" th:value="${m}" th:text="${m}"></option>
    </select>

    <button type="submit">Realizar Pago</button>

    <a class="link-volver" href="/inicio">Volver al inicio</a>

</form>
</div>

</body>
</html>
