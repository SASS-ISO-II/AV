<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Mis reservas</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    padding: 40px 20px;
    background: linear-gradient(to bottom, #F3E9DA 0%, #F3E9DA 45%, #6AA89B 45%, #6AA89B 100%);
}
.circle {
    position: absolute;
    border-radius: 50%;
    opacity: 0.22;
    filter: blur(3px);
    z-index: 0;
}

.c1 {
    width: 260px;
    height: 260px;
    top: 20px;
    left: 20px;
    background: #D9C8B4;
    animation: float1 18s infinite ease-in-out alternate;
}

.c2 {
    width: 340px;
    height: 340px;
    top: 180px;
    right: -60px;
    background: #1A3C40;
    opacity: 0.15;
    animation: float2 22s infinite ease-in-out alternate;
}

.c3 {
    width: 160px;
    height: 160px;
    bottom: 50px;
    left: 25%;
    background: #B8D7CE;
    animation: float3 26s infinite ease-in-out alternate;
}

@keyframes float1 { from { transform: translateY(0); } to { transform: translateY(40px); } }
@keyframes float2 { from { transform: translateY(0); } to { transform: translateY(-35px); } }
@keyframes float3 { from { transform: translateY(0); } to { transform: translateY(25px); } }

.card {
    max-width: 900px;
    margin: auto;
    background: #FAF4E8;
    padding: 32px;
    border-radius: 28px;
    box-shadow: 0 28px 60px rgba(0,0,0,0.22);
    border: 2px solid #E6D9C5;
}

h2 {
    text-align: center;
    color: #1A3C40;
    margin-bottom: 20px;
}

table {
    width: 100%;
    border-collapse: collapse;
    background: white;
    border-radius: 14px;
    overflow: hidden;
}

th, td {
    padding: 14px;
    border-bottom: 1px solid #ddd;
}

th {
    background: #1A3C40;
    color: #FAF4E8;
}

.estado-PENDIENTE { color: #b8860b; font-weight: 600; }
.estado-ACEPTADA  { color: #2e8b57; font-weight: 600; }
.estado-RECHAZADA { color: #b22222; font-weight: 600; }

.filtro {
    margin-bottom: 18px;
    text-align: right;
}

.btn {
    display: inline-block;
    padding: 10px 16px;
    background: #1A3C40;
    color: white;
    border-radius: 12px;
    text-decoration: none;
    font-weight: 600;
    margin-top: 20px;
}

.btn:hover { background: #163236; }
</style>
</head>

<body>
	<div class="circle c1"></div>
	<div class="circle c2"></div>
	<div class="circle c3"></div>
<div class="card">
    <h2>Mis reservas</h2>

    <div class="filtro">
        <form method="get" th:action="@{/reservaInquilino}">
            <label>Estado:</label>
            <select name="filtro" onchange="this.form.submit()">
                <option value="TODAS" th:selected="${filtroActual=='TODAS'}">Todas</option>
                <option value="PENDIENTE" th:selected="${filtroActual=='PENDIENTE'}">Pendientes</option>
                <option value="ACEPTADA" th:selected="${filtroActual=='ACEPTADA'}">Aceptadas</option>
                <option value="RECHAZADA" th:selected="${filtroActual=='RECHAZADA'}">Rechazadas</option>
            </select>
        </form>
    </div>

    <table>
        <tr>
            <th>Inmueble</th>
            <th>Fecha inicio</th>
            <th>Fecha fin</th>
            <th>Estado</th>
            <th>Reserva</th>
        </tr>

        <tr th:each="s : ${solicitudes}">
            <td th:text="${s.inmueble.calle + ' ' + s.inmueble.numero + ', ' + s.inmueble.localizacion}"></td>

            <td th:text="${s.fechaInicio != null ? s.fechaInicio : '—'}"></td>
            <td th:text="${s.fechaFin != null ? s.fechaFin : '—'}"></td>

            <td th:text="${s.estado}"
                th:class="'estado-' + ${s.estado}">
            </td>

            <td>
                <span th:if="${s.reservaConfirmada != null}">
                    Confirmada
                </span>
                <span th:if="${s.reservaConfirmada == null}">
                    —
                </span>
            </td>
        </tr>
    </table>

    <a class="btn" href="/inicio">Volver al inicio</a>
</div>

</body>
</html>
