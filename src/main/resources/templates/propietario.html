<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Perfil de Propietario</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    padding: 40px 20px;
    background: linear-gradient(to bottom, #F3E9DA 0%, #F3E9DA 45%, #6AA89B 45%, #6AA89B 100%);
    position: relative;
    overflow-x: hidden;
}

/* Burbujas */
.circle {
    position: absolute;
    border-radius: 50%;
    opacity: 0.22;
    filter: blur(3px);
    z-index: -1;
}

.c1 { width: 260px; height: 260px; top: 20px; left: 20px; background: #D9C8B4; animation: float1 18s infinite alternate ease-in-out; }
.c2 { width: 340px; height: 340px; top: 180px; right: -60px; background: #1A3C40; opacity: 0.15; animation: float2 22s infinite alternate ease-in-out; }
.c3 { width: 160px; height: 160px; bottom: 50px; left: 25%; background: #B8D7CE; animation: float3 26s infinite alternate ease-in-out; }

@keyframes float1 { from { transform: translateY(0); } to { transform: translateY(40px); } }
@keyframes float2 { from { transform: translateY(0); } to { transform: translateY(-35px); } }
@keyframes float3 { from { transform: translateY(0); } to { transform: translateY(25px); } }

/* Tarjeta */
.card {
    width: 420px;
    margin: 0 auto;
    background: #FAF4E8;
    padding: 36px;
    border-radius: 32px;
    box-shadow: 0 28px 60px rgba(0,0,0,0.22);
    border: 2px solid #E6D9C5;
    animation: fadeIn 0.55s ease-out, slideUp 0.6s ease-out;
}

h2 {
    text-align: center;
    font-size: 32px;
    color: #1A3C40;
    margin-bottom: 16px;
}

.info-line {
    margin: 12px 0;
    font-size: 17px;
    color: #1A3C40;
    font-weight: 500;
}

/* Botones */
.btn {
    display: block;
    width: 100%;
    padding: 14px;
    margin-top: 18px;
    text-align: center;
    background: #1A3C40;
    color: #F8F8F8;
    border-radius: 18px;
    text-decoration: none;
    font-weight: 600;
    transition: 0.2s ease;
    letter-spacing: 0.3px;
}

.btn:hover { background: #163236; }
.btn:active { transform: scale(0.97); }

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

</style>
</head>

<body>

<div class="circle c1"></div>
<div class="circle c2"></div>
<div class="circle c3"></div>

<div th:if="${solicitudesPendientes != null and solicitudesPendientes > 0}" class="popup-overlay">
    <div class="popup-box">
        <p>Tienes <span th:text="${solicitudesPendientes}"></span> solicitudes pendientes.</p>
        <button class="popup-btn" onclick="cerrarPopup()">Aceptar</button>
    </div>
</div>

<script>
function cerrarPopup() {
    document.querySelectorAll('.popup-overlay').forEach(p => p.style.display = 'none');
}
</script>

<div class="card">
    <h2>Propietario</h2>

    <p class="info-line" th:text="'Nombre: ' + ${registro.nombre}"></p>
    <p class="info-line" th:text="'Apellidos: ' + ${registro.apellidos}"></p>
    <p class="info-line" th:text="'Dirección: ' + ${registro.direccion}"></p>
    <p class="info-line" th:text="'Usuario: ' + ${registro.login}"></p>

    <a class="btn" href="/alta">Dar de alta un inmueble</a>
    <a class="btn" href="/login">Entrar con otro usuario</a>
    <a class="btn" href="/inicio">Volver al inicio</a>
	<a class="btn" href="/solicitudes">Ver notificaciones</a>
</div>

</body>
</html>
