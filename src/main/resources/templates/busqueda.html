<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Buscar Inmuebles</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(to bottom, #F3E9DA 0%, #F3E9DA 45%, #6AA89B 45%, #6AA89B 100%);
            padding: 40px 20px;
            overflow-x: hidden;
        }

        h1 {
            text-align: center;
            font-size: 36px;
            font-weight: 700;
            color: #1A3C40;
            margin-bottom: 30px;
        }

        /* TARJETA FORMULARIO */
        .card {
            width: 520px;
            margin: 0 auto;
            background: #FAF4E8;
            padding: 35px;
            border-radius: 30px;
            border: 2px solid #E6D9C5;
            box-shadow: 0 22px 45px rgba(0,0,0,0.25);
        }

        label {
            display: block;
            margin-bottom: 6px;
            margin-top: 16px;
            font-weight: 600;
            font-size: 18px;
            color: #1A3C40;
        }

        input, select {
            width: 100%;
            padding: 12px 14px;
            border-radius: 14px;
            border: 1px solid #D9C8B4;
            background: #F8F1E6;
            font-size: 16px;
            transition: 0.18s;
        }

        input:focus, select:focus {
            border-color: #6AA89B;
            box-shadow: 0 0 0 3px rgba(106,168,155,0.25);
            outline: none;
        }

        button, input[type="submit"] {
            margin-top: 25px;
            width: 100%;
            padding: 14px;
            background: #1A3C40;
            color: #FFF;
            border: none;
            border-radius: 18px;
            cursor: pointer;
            font-size: 18px;
            font-weight: 600;
        }

        button:hover, input[type="submit"]:hover {
            background: #163236;
        }

        /* RESULTADOS */
        h2 {
            text-align: center;
            font-size: 30px;
            margin-top: 50px;
            margin-bottom: 25px;
            color: #FAF4E8;
            font-weight: 700;
        }

        .result-card {
            width: 600px;
            margin: 0 auto 20px;
            background: #FAF4E8;
            padding: 25px;
            border-radius: 26px;
            box-shadow: 0 14px 35px rgba(0,0,0,0.22);
            border: 2px solid #E6D9C5;
            font-size: 18px;
            color: #1A3C40;
            line-height: 1.45;
        }

        .result-card p {
            margin-bottom: 8px;
        }

        .result-card a {
            color: #1A3C40;
            text-decoration: none;
            font-weight: 600;
        }

        .result-card a:hover {
            text-decoration: underline;
        }

    </style>
</head>

<body>

<h1>Buscar inmuebles</h1>

<!-- =====================================
              FORMULARIO
===================================== -->
<div class="card">

    <form th:action="@{/buscar/resultados}" method="get">

        <label>Localización</label>
        <input type="text" name="localizacion" th:value="${localizacion}">

        <label>Precio máximo por noche</label>
        <input type="number" step="0.01" name="precioMax" th:value="${precioMax}">

        <label>Capacidad mínima</label>
        <input type="number" name="capacidadMin" th:value="${capacidadMin}">

        <label>Tipo</label>
        <select name="tipo">
            <option value="">Cualquier tipo</option>

            <option value="Habitación individual"
                    th:selected="${tipo == 'Habitación individual'}">
                Habitación individual
            </option>

            <option value="Apartamento completo"
                    th:selected="${tipo == 'Apartamento completo'}">
                Apartamento completo
            </option>

            <option value="Casa"
                    th:selected="${tipo == 'Casa'}">
                Casa
            </option>
        </select>

        <input type="submit" value="Buscar" />

    </form>
</div>


<!-- =====================================
              RESULTADOS
===================================== -->
<h2>Resultados</h2>

<div th:if="${resultados != null}">

    <div th:if="${#lists.isEmpty(resultados)}">
        <p style="text-align:center; color:white; font-size:22px;">No se encontraron inmuebles.</p>
    </div>

    <div th:each="i : ${resultados}" class="result-card">

        <p><strong>Localización:</strong> <span th:text="${i.localizacion}"></span></p>
        <p><strong>Calle:</strong> <span th:text="${i.calle}"></span></p>
        <p><strong>Precio:</strong> <span th:text="${i.precioNoche}"></span> €/noche</p>
        <p><strong>Capacidad:</strong> <span th:text="${i.capacidad}"></span></p>
        <p><strong>Tipo:</strong> <span th:text="${i.tipo}"></span></p>

        <a th:href="@{'/reserva?inmuebleId=' + ${i.id}}">Reservar</a>
    </div>

</div>

</body>
</html>
