<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Alta de Inmueble</title>
</head>
<body>
<h2>Dar de alta un inmueble</h2>

<form th:action="@{/inmuebles/guardar}" th:object="${inmueble}" method="post">

    <label>Calle:</label>
    <input type="text" th:field="*{calle}" required><br><br>

    <label>Número :</label>
    <input type="text" th:field="*{numero}" required><br><br>

    <label>Localización (ciudad/pueblo):</label>
    <input type="text" th:field="*{localizacion}" required><br><br>

    <label>Precio por noche (€):</label>
    <input type="number" step="0.01" th:field="*{precioNoche}" required><br><br>

    <label>Capacidad (número de inquilinos):</label>
    <input type="number" th:field="*{capacidad}" min="1" required><br><br>

    <label>Tipo de inmueble:</label>
    <select th:field="*{tipo}">
        <option value="Habitación individual">Habitación individual</option>
        <option value="Apartamento completo">Apartamento completo</option>
        <option value="Casa rural">Casa </option>
    </select><br><br>

    <button type="submit">Guardar</button>
</form>

</body>
</html>
