<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Alta de Inmueble</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    padding: 40px 20px;
    background: linear-gradient(to bottom, #F3E9DA 0%, #F3E9DA 45%, #6AA89B 45%, #6AA89B 100%);
    position: relative;
    overflow-x: hidden;
}


.circle {
    position: absolute;
    border-radius: 50%;
    opacity: 0.22;
    filter: blur(3px);
    z-index: -1;
}

.c1 {
    width: 260px;
    height: 260px;
    top: 20px;
    left: 20px;
    background: #D9C8B4;
    animation: float1 18s infinite ease-in-out alternate;
}

.c2 {
    width: 340px;
    height: 340px;
    top: 180px;
    right: -60px;
    background: #1A3C40;
    opacity: 0.15;
    animation: float2 22s infinite ease-in-out alternate;
}

.c3 {
    width: 160px;
    height: 160px;
    bottom: 50px;
    left: 25%;
    background: #B8D7CE;
    animation: float3 26s infinite ease-in-out alternate;
}

@keyframes float1 { from { transform: translateY(0); } to { transform: translateY(40px); } }
@keyframes float2 { from { transform: translateY(0); } to { transform: translateY(-35px); } }
@keyframes float3 { from { transform: translateY(0); } to { transform: translateY(25px); } }



h2 {
    text-align: center;
    font-size: 30px;
    color: #1A3C40;
    margin-bottom: 12px;
    font-weight: 600;
}

.titulo-secundario {
    text-align: center;
    color: #1A3C40;
    margin-bottom: 20px;
}


.form-wrapper {
    width: 460px;
    margin: 0 auto;
    background: #FAF4E8;
    padding: 38px 36px;
    border-radius: 34px;
    box-shadow: 0 28px 60px rgba(0,0,0,0.22);
    animation: fadeIn 0.55s ease-out, slideUp 0.65s ease-out;
    border: 2px solid #E6D9C5;
}



label {
    margin-top: 16px;
    display: block;
    font-weight: 500;
    color: #1A3C40;
}

input, select {
    width: 100%;
    margin-top: 6px;
    padding: 12px 14px;
    border-radius: 12px;
    border: 1px solid #D9C8B4;
    background: #F8F1E6;
    font-size: 15px;
    transition: 0.18s;
}

input:focus, select:focus {
    border-color: #6AA89B;
    box-shadow: 0 0 0 3px rgba(106,168,155,0.25);
    outline: none;
}



button {
    margin-top: 24px;
    width: 100%;
    padding: 14px;
    border: none;
    background: #1A3C40;
    color: #F8F8F8;
    border-radius: 18px;
    cursor: pointer;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 0.3px;
    transition: 0.18s ease;
}

button:hover { background: #163236; }
button:active { transform: scale(0.97); }

.link-volver {
    text-align: center;
    margin-top: 16px;
    display: block;
    color: #1A3C40;
    font-size: 14px;
    text-decoration: none;
}
.link-volver:hover { text-decoration: underline; }


.mensaje {
    color: #1A3C40;
    text-align: center;
    margin-bottom: 12px;
    font-weight: 500;
}

.error {
    color: #d9534f;
    text-align: center;
    margin-bottom: 12px;
    font-weight: 500;
}

.aviso {
    text-align: center;
    color: #d9534f;
    margin-bottom: 15px;
    font-weight: 500;
}


.modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    display: flex;
    justify-content: center;
    align-items: center;
    backdrop-filter: blur(10px);
    animation: fadeIn 0.3s ease-out;
    z-index: 40;
}

.modal-content {
    background: #FAF4E8;
    padding: 32px;
    border-radius: 26px;
    width: 320px;
    text-align: center;
    box-shadow: 0 22px 55px rgba(0,0,0,0.35);
    animation: scaleIn 0.28s ease-out;
    border: 2px solid #E6D9C5;
}

.checkmark {
    font-size: 52px;
    color: #6AA89B;
    animation: popCheck 0.5s ease-out;
}


@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
@keyframes scaleIn { from { transform: scale(0.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }
@keyframes popCheck { 0% { transform: scale(0.4); opacity: 0; } 60% { transform: scale(1.3); opacity: 1; } 100% { transform: scale(1); } }

</style>
</head>

<body>

<div class="circle c1"></div>
<div class="circle c2"></div>
<div class="circle c3"></div>

<h2>Dar de alta un inmueble</h2>

<p th:if="${mensaje}" th:text="${mensaje}" class="mensaje"></p>
<p th:if="${error}" th:text="${error}" class="error"></p>

<div th:if="${!estaLogueado}" class="aviso">
    <p>Debes <a href="/login">iniciar sesión</a> antes de poder registrar un inmueble.</p>
</div>

<div th:if="${estaLogueado}" class="titulo-secundario">
    <p>Propietario logueado: <b th:text="${propietario.login}"></b></p>
</div>

<div class="form-wrapper">

<form th:action="@{/alta}" th:object="${inmueble}" method="post">
<fieldset th:attr="disabled=${!estaLogueado}">

<label>Calle:</label>
<input type="text" th:field="*{calle}" required>

<label>Número:</label>
<input type="text" th:field="*{numero}" required>

<label>Localización (ciudad/pueblo):</label>
<input type="text" th:field="*{localizacion}" required>

<label>Precio por noche (€):</label>
<input type="number" step="0.01" th:field="*{precioNoche}" required>

<label>Capacidad (número de inquilinos):</label>
<input type="number" th:field="*{capacidad}" min="1" required>

<label>Tipo de inmueble:</label>
<select th:field="*{tipo}">
    <option value="Habitación individual">Habitación individual</option>
    <option value="Apartamento completo">Apartamento completo</option>
    <option value="Casa ">Casa</option>
</select>

<button type="submit">Guardar</button>

<a class="link-volver" href="/inicio">Volver al inicio</a>

</fieldset>
</form>
</div>

<div th:if="${popupExito}" class="modal" id="popupExito">
    <div class="modal-content">
        <div class="checkmark">✔️</div>
        <h3 style="margin-top: 10px; margin-bottom:8px;">Inmueble guardado</h3>
        <p>El inmueble se ha registrado correctamente.</p>
        <button onclick="cerrarPopup()" style="margin-top: 20px; width: 100%;">Aceptar</button>
    </div>
</div>

<script>
function cerrarPopup() {
    var modal = document.getElementById("popupExito");
    if (modal) modal.style.display = "none";
}
</script>

</body>
</html>
