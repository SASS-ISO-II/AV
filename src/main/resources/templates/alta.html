<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Alta de Inmueble</title>
    <style>
        h2 {
            text-align: center;
        }
        form {
            width: 400px;
            margin: 0 auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
            background-color: #f9f9f9;
        }
        input, select {
            width: 100%;
            margin-top: 5px;
            padding: 6px;
            box-sizing: border-box;
        }
        button {
            margin-top: 15px;
            width: 100%;
            padding: 10px;
        }
        .mensaje { color: green; text-align: center; }
        .error { color: red; text-align: center; }
        .aviso { text-align: center; color: red; margin-bottom: 15px; }
    </style>
</head>
<body>

<h2>Dar de alta un inmueble</h2>

<p th:if="${mensaje}" th:text="${mensaje}" class="mensaje"></p>
<p th:if="${error}" th:text="${error}" class="error"></p>

<div th:if="${!estaLogueado}" class="aviso">
    <p>Debes <a href="/login">iniciar sesión</a> antes de poder registrar un inmueble.</p>
</div>

<div th:if="${estaLogueado}" style="text-align:center; margin-bottom:15px;">
    <p>Propietario logueado: <b th:text="${propietario.login}"></b></p>
</div>

<form th:action="@{/alta}" th:object="${inmueble}" method="post">
    <fieldset th:attr="disabled=${!estaLogueado}">

        <label>Calle:</label>
        <input type="text" th:field="*{calle}" required><br><br>

        <label>Número:</label>
        <input type="text" th:field="*{numero}" required><br><br>

        <label>Localización (ciudad/pueblo):</label>
        <input type="text" th:field="*{localizacion}" required><br><br>

        <label>Precio por noche (€):</label>
        <input type="number" step="0.01" th:field="*{precioNoche}" required><br><br>

        <label>Capacidad (número de inquilinos):</label>
        <input type="number" th:field="*{capacidad}" min="1" required><br><br>

        <label>Tipo de inmueble:</label>
        <select th:field="*{tipo}">
            <option value="Habitación individual">Habitación individual</option>
            <option value="Apartamento completo">Apartamento completo</option>
            <option value="Casa ">Casa </option>
        </select><br><br>

        <button type="submit">Guardar</button>
		
		<p><a href="/inicio">Volver al inicio</a></p>

    </fieldset>
</form>

</body>
</html>
