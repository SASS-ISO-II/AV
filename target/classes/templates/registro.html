<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Registro de Usuario</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    padding: 40px 20px;
    background: linear-gradient(to bottom, #F3E9DA 0%, #F3E9DA 45%, #6AA89B 45%, #6AA89B 100%);
    position: relative;
    overflow-x: hidden;
}

/* Burbujas decorativas */
.circle {
    position: absolute;
    border-radius: 50%;
    opacity: 0.22;
    filter: blur(3px);
    z-index: 0;
}

.c1 { width: 260px; height: 260px; top: 20px; left: 20px; background: #D9C8B4; animation: float1 18s infinite alternate ease-in-out; }
.c2 { width: 340px; height: 340px; top: 180px; right: -60px; background: #1A3C40; opacity: 0.15; animation: float2 22s infinite alternate ease-in-out; }
.c3 { width: 160px; height: 160px; bottom: 50px; left: 25%; background: #B8D7CE; animation: float3 26s infinite alternate ease-in-out; }

@keyframes float1 { from { transform: translateY(0); } to { transform: translateY(40px); } }
@keyframes float2 { from { transform: translateY(0); } to { transform: translateY(-35px); } }
@keyframes float3 { from { transform: translateY(0); } to { transform: translateY(25px); } }

/* Tarjeta / Formulario */
.form-card {
    width: 460px;
    margin: 0 auto;
    background: #FAF4E8;
    padding: 38px 36px;
    border-radius: 34px;
    box-shadow: 0 28px 60px rgba(0,0,0,0.22);
    border: 2px solid #E6D9C5;
    animation: fadeIn 0.55s ease-out, slideUp 0.6s ease-out;
}

/* Título */
h2 {
    text-align: center;
    font-size: 30px;
    color: #1A3C40;
    margin-bottom: 20px;
    font-weight: 600;
}

/* Inputs */
label {
    margin-top: 16px;
    display: block;
    font-weight: 500;
    color: #1A3C40;
}

input, select {
    width: 100%;
    margin-top: 6px;
    padding: 12px 14px;
    border-radius: 12px;
    border: 1px solid #D9C8B4;
    background: #F8F1E6;
    font-size: 15px;
    transition: 0.18s;
}

input:focus, select:focus {
    border-color: #6AA89B;
    box-shadow: 0 0 0 3px rgba(106,168,155,0.25);
    outline: none;
}

/* Botón */
button, .btn {
    margin-top: 24px;
    width: 100%;
    padding: 14px;
    border: none;
    background: #1A3C40;
    color: #F8F8F8;
    border-radius: 18px;
    cursor: pointer;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 0.3px;
    transition: 0.18s ease;
}

button:hover, .btn:hover { background: #163236; }
button:active, .btn:active { transform: scale(0.97); }

.link {
    text-align: center;
    margin-top: 14px;
    display: block;
    color: #1A3C40;
    font-size: 14px;
    text-decoration: none;
}
.link:hover { text-decoration: underline; }
.error { color: red; text-align: center; }

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

</style>
</head>

<body>

<!-- Burbujas -->
<div class="circle c1"></div>
<div class="circle c2"></div>
<div class="circle c3"></div>

<div class="form-card">
    <h2>Registro de Usuario</h2>
	<p th:if="${error}" th:text="${error}" class="error"></p>
    <form th:action="@{/registro}" th:object="${registro}" method="post">

        <label>Nombre:</label>
        <input type="text" th:field="*{nombre}" required>

        <label>Apellidos:</label>
        <input type="text" th:field="*{apellidos}" required>

        <label>Dirección:</label>
        <input type="text" th:field="*{direccion}" required>

        <label>Nombre de usuario:</label>
        <input type="text" th:field="*{login}" required>

        <label>Contraseña:</label>
        <input type="password" th:field="*{pass}" required>

        <label>Tipo de usuario:</label>
        <select name="tipoUsuario">
            <option value="inquilino">Inquilino</option>
            <option value="propietario">Propietario</option>
        </select>

        <button type="submit">Registrar</button>

        <a class="link" href="/login">¿Ya tienes usuario?</a>
        <a class="link" href="/inicio">Volver al inicio</a>
    </form>
</div>

</body>
</html>
